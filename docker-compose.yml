services:
  postgres:
    image: postgres:16-alpine
    container_name: student-profile-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_profile
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - student_profile_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_profile"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  student_profile_pgdata:
